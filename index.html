<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Пантеон Фатума</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: #05070a;
            color: #e0e0e0;
            font-family: 'Cormorant Garamond', serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* === БОЖЕСТВЕННЫЙ ФОН: ТУМАН И ЗОЛОТАЯ ПЫЛЬЦА === */
        .divine-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at 50% -20%, #1e1b2e 0%, #05070a 80%);
            z-index: -2;
        }
        
        .mystic-fog {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none;
            background: transparent url("data:image/svg+xml,%3Csvg width='400' height='400' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='50' cy='50' r='1.2' fill='%23d4af37' opacity='0.3'/%3E%3Ccircle cx='250' cy='150' r='0.8' fill='%23ffffff' opacity='0.2'/%3E%3Ccircle cx='350' cy='350' r='1.5' fill='%23d4af37' opacity='0.4'/%3E%3C/svg%3E") repeat;
            animation: drift 60s linear infinite;
        }

        @keyframes drift {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-400px) rotate(5deg); }
        }

        header { text-align: center; padding: 60px 20px 40px; position: relative; }
        h1 {
            font-family: 'Cinzel Decorative', cursive;
            font-size: 3.2rem;
            color: #fff;
            letter-spacing: 6px;
            text-transform: uppercase;
            text-shadow: 0 0 40px rgba(212, 175, 55, 0.4);
            margin-bottom: 10px;
        }
        .subtitle {
            font-size: 1.1rem;
            color: #8a9ba8;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 400;
        }

        /* === СЕТКА ПАНТЕОНА === */
        .pantheon-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 25px;
            padding: 20px;
            max-width: 1100px;
            margin: 0 auto 80px;
        }

        /* === КАРТОЧКА БОГА === */
        .god-card {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            aspect-ratio: 2 / 3;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            transition: all 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
            background: #0a0c10;
            box-shadow: 0 15px 40px rgba(0,0,0,0.9);
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .god-card img {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            transition: 0.8s;
            z-index: 1;
        }

        .card-content {
            position: relative;
            z-index: 4;
            padding: 25px 10px;
            text-align: center;
            background: linear-gradient(0deg, rgba(5,7,10,1) 0%, rgba(5,7,10,0.8) 50%, transparent 100%);
        }

        .god-name {
            font-family: 'Cinzel Decorative', cursive;
            color: #fff;
            font-size: 1.1rem;
            letter-spacing: 2px;
            transition: 0.3s;
        }

        /* === АКТИВНЫЙ (АПОЛЛОН) === */
        .unlocked {
            border-color: rgba(212, 175, 55, 0.3);
            cursor: pointer;
        }
        .unlocked:hover {
            transform: translateY(-12px) scale(1.02);
            border-color: #d4af37;
            box-shadow: 0 20px 50px rgba(212, 175, 55, 0.3);
        }
        .unlocked:hover img { transform: scale(1.1); }
        .unlocked .god-name { color: #d4af37; text-shadow: 0 0 15px rgba(212,175,55,0.5); }

        /* === ЗАКРЫТЫЕ БОГИ === */
        .locked {
            cursor: not-allowed;
            filter: grayscale(100%) contrast(1.1);
        }
        .locked .card-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(3px);
            z-index: 3;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .lock-icon {
            font-size: 2.2rem;
            opacity: 0.5;
            filter: drop-shadow(0 0 10px #000);
        }
        .locked .god-name { opacity: 0.6; }

        /* Текст синхронизации */
        .sync-active { font-size: 0.9rem; color: #d4af37; font-style: italic; animation: breathe 2s infinite; }
        @keyframes breathe { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

        @media (max-width: 600px) {
            h1 { font-size: 2.4rem; letter-spacing: 4px; }
            .pantheon-grid { grid-template-columns: repeat(2, 1fr); gap: 15px; }
            .god-card { border-radius: 15px; }
        }
    </style>
</head>

    <script>
        function runFacecontrol(event, element) {
            event.preventDefault();
            
            // Твоя ссылка на Вебхук
            const WEBHOOK_URL = "https://hook.eu1.make.com/ipn1avyoehbtuvy9fhhektpxxh6vv9fb";

            const nameEl = element.querySelector('.god-name');
            const originalName = nameEl.innerText;
            nameEl.innerHTML = "<span class='sync-active'>Синхронизация...</span>";

            const tg = window.Telegram.WebApp;
            let userId = tg.initDataUnsafe?.user?.id;

            // Если не в ТГ — на лендинг
            if (!userId) {
                window.location.href = "apollo-landing.html";
                return;
            }

            fetch(WEBHOOK_URL + "?tg_id=" + userId)
                .then(res => res.json())
                .then(data => {
                    if (data && data.access === "YES") {
                        // ВОТ ОНО. ТЕПЕРЬ ПРИ ПЕРЕХОДЕ ID ЕДЕТ СЛЕДОМ:
                        window.location.href = "apollo.html?tg_id=" + userId;
                    } else {
                        window.location.href = "apollo-landing.html";
                    }
                })
                .catch(err => {
                    window.location.href = "apollo-landing.html";
                });
        }
