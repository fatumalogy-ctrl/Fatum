<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Пантеон Фатума</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: #05070a;
            color: #e0e0e0;
            font-family: 'Cormorant Garamond', serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .divine-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at 50% -20%, #1e1b2e 0%, #05070a 80%);
            z-index: -2;
        }
        
        .mystic-fog {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none;
            background: transparent url("data:image/svg+xml,%3Csvg width='400' height='400' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='50' cy='50' r='1.2' fill='%23d4af37' opacity='0.3'/%3E%3Ccircle cx='250' cy='150' r='0.8' fill='%23ffffff' opacity='0.2'/%3E%3Ccircle cx='350' cy='350' r='1.5' fill='%23d4af37' opacity='0.4'/%3E%3C/svg%3E") repeat;
            animation: drift 60s linear infinite;
        }

        @keyframes drift {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-400px) rotate(5deg); }
        }

        header { text-align: center; padding: 60px 20px 40px; position: relative; }
        h1 {
            font-family: 'Cinzel Decorative', cursive;
            font-size: 3.2rem;
            color: #fff;
            letter-spacing: 6px;
            text-transform: uppercase;
            text-shadow: 0 0 40px rgba(212, 175, 55, 0.4);
            margin-bottom: 10px;
        }
        .subtitle {
            font-size: 1.1rem;
            color: #8a9ba8;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 400;
        }

        .auth-container {
            position: absolute; top: 20px; right: 20px;
            display: flex; align-items: center; gap: 10px;
        }
        
        #auth-status {
            font-size: 0.9rem; color: #d4af37; letter-spacing: 1px;
            opacity: 0.7; font-family: 'Cinzel Decorative', cursive;
        }

        #user-profile-btn {
            display: none;
            align-items: center; gap: 10px;
            cursor: pointer;
            padding: 5px 15px 5px 5px;
            background: rgba(10, 12, 16, 0.6);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 30px;
            transition: all 0.4s ease;
            backdrop-filter: blur(5px);
        }

        #user-profile-btn:hover {
            border-color: #00f0ff;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
            transform: scale(1.02);
        }

        .profile-avatar {
            width: 40px; height: 40px; border-radius: 50%;
            object-fit: cover;
            border: 2px solid #d4af37;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
            transition: 0.4s;
        }

        .profile-name {
            font-family: 'Cinzel Decorative', cursive;
            color: #fff; font-size: 0.9rem; letter-spacing: 1px;
        }

        #profile-modal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(5, 7, 10, 0.8); backdrop-filter: blur(10px);
            z-index: 1000;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none;
            transition: opacity 0.4s ease;
        }

        #profile-modal.active { opacity: 1; pointer-events: all; }

        .modal-box {
            background: radial-gradient(circle at center, #12161e 0%, #05070a 100%);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 20px;
            padding: 40px; width: 320px;
            display: flex; flex-direction: column; align-items: center; gap: 20px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(212, 175, 55, 0.1);
            transform: translateY(20px) scale(0.95);
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            position: relative;
        }

        #profile-modal.active .modal-box { transform: translateY(0) scale(1); }

        .close-modal {
            position: absolute; top: 15px; right: 20px;
            background: none; border: none; color: #8a9ba8;
            font-size: 1.5rem; cursor: pointer; transition: 0.3s;
        }

        .modal-logo { width: 80px; filter: drop-shadow(0 0 10px #00f0ff); animation: pulseLogo 3s infinite; }

        @keyframes pulseLogo {
            0%, 100% { filter: drop-shadow(0 0 5px #00f0ff); }
            50% { filter: drop-shadow(0 0 20px #00f0ff) brightness(1.2); }
        }

        .modal-menu { display: flex; flex-direction: column; width: 100%; gap: 15px; }

        .modal-btn {
            background: rgba(10, 12, 16, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e0e0e0; font-family: 'Cinzel Decorative', cursive;
            font-size: 1rem; letter-spacing: 2px; padding: 12px;
            border-radius: 10px; cursor: pointer; transition: 0.3s;
            text-transform: uppercase;
        }

        .modal-btn:hover { border-color: #d4af37; color: #d4af37; box-shadow: 0 0 15px rgba(212, 175, 55, 0.3); }

        .logout-btn:hover { border-color: #ff3366; color: #ff3366; box-shadow: 0 0 15px rgba(255, 51, 102, 0.3); }

        .pantheon-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 25px;
            padding: 20px;
            max-width: 1100px;
            margin: 0 auto 80px;
        }

        .god-card {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            aspect-ratio: 2 / 3;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            transition: all 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
            background: transparent;
        }

        .god-card img {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: contain;
            transition: 0.8s;
            z-index: 1;
        }

        .card-content { position: relative; z-index: 4; padding: 25px 10px; text-align: center; }

        .god-name {
            font-family: 'Cinzel Decorative', cursive;
            color: #fff; font-size: 1.1rem; letter-spacing: 2px;
            text-shadow: 0 0 5px rgba(0,0,0,0.8);
        }

        .unlocked { cursor: pointer; }
        .unlocked:hover { transform: translateY(-12px) scale(1.02); }
        .unlocked:hover img { transform: scale(1.1); }
        .unlocked:hover .god-name { color: #d4af37; text-shadow: 0 0 15px rgba(212,175,55,0.5); }

        .locked { cursor: not-allowed; filter: grayscale(100%) contrast(1.1); }
        .locked .card-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            backdrop-filter: blur(3px); z-index: 3;
            display: flex; justify-content: center; align-items: center;
        }
        .lock-icon { font-size: 2.2rem; opacity: 0.5; }

        .sync-active { font-size: 0.9rem; color: #00f0ff; font-style: italic; animation: breathe 1.5s infinite; }
        @keyframes breathe { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

        @media (max-width: 600px) {
            h1 { font-size: 2.4rem; letter-spacing: 4px; }
            .pantheon-grid { grid-template-columns: repeat(2, 1fr); gap: 15px; }
            .god-card { border-radius: 15px; }
        }
    </style>
</head>

    <script type="module">
        import { auth, googleProvider, signInWithPopup, onAuthStateChanged, db, doc, setDoc, getDoc } from './firebase-config.js';
        import { signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const authStatusElement = document.getElementById('auth-status');
        const userProfileBtn = document.getElementById('user-profile-btn');
        const profileNameEl = document.getElementById('profile-name');
        const profileModal = document.getElementById('profile-modal');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const logoutBtn = document.getElementById('logout-btn');

        let currentUser = null;

        // Модалка
        userProfileBtn.onclick = () => profileModal.classList.add('active');
        closeModalBtn.onclick = () => profileModal.classList.remove('active');
        logoutBtn.onclick = async () => { await signOut(auth); window.location.reload(); };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                authStatusElement.style.display = "none";
                userProfileBtn.style.display = "flex";
                profileNameEl.innerText = user.displayName || user.email.split('@')[0];
                await setDoc(doc(db, "users", user.uid), { name: user.displayName, email: user.email, lastLogin: new Date() }, { merge: true });
            } else {
                currentUser = null;
                authStatusElement.style.display = "block";
                userProfileBtn.style.display = "none";
            }
        });

        // Логика клика
        document.querySelectorAll('.god-card.unlocked').forEach(card => {
            card.addEventListener('click', async (e) => {
                const targetUrl = card.getAttribute('data-target');
                const productName = card.getAttribute('data-product');
                const nameEl = card.querySelector('.god-name');
                const originalName = nameEl.innerText;

                if (!currentUser) {
                    try {
                        const result = await signInWithPopup(auth, googleProvider);
                        currentUser = result.user;
                    } catch (err) { alert("Вход отменен"); return; }
                }

                // ПРОВЕРКА ДОСТУПА ПРЯМО ЗДЕСЬ
                if (productName === "aether") {
                    nameEl.innerHTML = "<span class='sync-active'>Проверка доступа...</span>";
                    try {
                        // Лезем в твою подколлекцию
                        const productRef = doc(db, "users", currentUser.uid, "products", "aether");
                        const snap = await getDoc(productRef);

                        if (snap.exists() && snap.data().hasAccess === true) {
                            window.location.href = targetUrl; // ПУСКАЕМ
                        } else {
                            // НЕТ ДОСТУПА -> НА ЛЕНДИНГ
                            window.location.href = "https://fatumalogy-ctrl.github.io/Fatum/aetherdoor.html";
                        }
                    } catch (err) {
                        console.error("Ошибка базы:", err);
                        window.location.href = "https://fatumalogy-ctrl.github.io/Fatum/aetherdoor.html";
                    }
                } else {
                    window.location.href = targetUrl;
                }
            });
        });
    </script>
