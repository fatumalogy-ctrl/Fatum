<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ЭФИР: НЕЙРОМАТРИЦА (СКАНИРОВАНИЕ)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Rajdhani:wght@500;600;700;900&family=Share+Tech+Mono&display=swap');

        :root {
            --cyan-core: #00f0ff;
            --cyan-glow: rgba(0, 240, 255, 0.6);
            --cyan-dim: rgba(0, 240, 255, 0.1);
            --metal-dark: #05070a;
            --metal-panel: #0b0e14;
            --metal-border: #2a3441;
            --text-main: #e6f0ff;
            --text-muted: #6a7c8f;
            --alert: #ff0055;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            -webkit-tap-highlight-color: transparent; 
        }

        body {
            background-color: var(--metal-dark);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            width: 100vw; height: 100vh;
            overflow: hidden; 
            display: flex; flex-direction: column;
            background: radial-gradient(circle at 50% 50%, #0d131c 0%, var(--metal-dark) 100%);
        }

        /* === БЭКГРАУНД И ЭФФЕКТЫ === */
        .cyber-grid {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.02) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 0; opacity: 0.8; pointer-events: none;
        }
        
        .glow-orb {
            position: absolute; top: -10vw; left: 50%; transform: translateX(-50%);
            width: 50vw; height: 50vw; border-radius: 50%;
            background: radial-gradient(circle, rgba(0,240,255,0.05) 0%, transparent 70%);
            z-index: 0; pointer-events: none; filter: blur(40px);
        }

        /* === ОВЕРЛЕЙ БЕЗОПАСНОСТИ === */
        #security-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: var(--metal-dark); z-index: 99999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.5s ease;
        }
        .security-text {
            color: var(--cyan-core); font-family: 'Rajdhani', sans-serif;
            font-size: 1.5rem; letter-spacing: 5px; text-transform: uppercase;
            animation: pulseText 1.5s infinite; text-shadow: 0 0 10px var(--cyan-glow);
        }
        @keyframes pulseText { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

        /* === HUD ПРОГРЕСС-БАР (СИНХРОНИЗАЦИЯ) === */
        .hud-container {
            position: relative; z-index: 10; padding: 20px 20px 0;
            display: flex; flex-direction: column; align-items: center; width: 100%;
            max-width: 800px; margin: 0 auto;
        }
        
        .hud-top { display: flex; justify-content: space-between; width: 100%; margin-bottom: 10px; align-items: flex-end;}
        
        .hud-title {
            font-family: 'Rajdhani', sans-serif; font-size: 1.2rem; font-weight: 700;
            color: var(--cyan-core); letter-spacing: 4px; text-transform: uppercase;
            text-shadow: 0 0 10px var(--cyan-glow); display: flex; align-items: center; gap: 10px;
        }
        .hud-title::before { content: ''; display: inline-block; width: 10px; height: 10px; background: var(--cyan-core); border-radius: 50%; box-shadow: 0 0 10px var(--cyan-core); animation: blink 2s infinite;}
        
        .hud-percent {
            font-family: 'Share Tech Mono', monospace; font-size: 1.5rem; color: #fff;
            text-shadow: 0 0 10px var(--cyan-glow);
        }

        .hud-track {
            width: 100%; height: 6px; background: rgba(255,255,255,0.05);
            border-radius: 3px; position: relative; overflow: hidden;
            border: 1px solid rgba(0, 240, 255, 0.1);
        }
        .hud-fill {
            position: absolute; top: 0; left: 0; height: 100%; width: 0%;
            background: var(--cyan-core); box-shadow: 0 0 15px var(--cyan-core);
            transition: width 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .hud-fill::after {
            content: ''; position: absolute; top: 0; right: 0; width: 20px; height: 100%;
            background: #fff; filter: blur(2px);
        }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* === ГЛАВНЫЙ КОНТЕЙНЕР АНКЕТЫ === */
        .scanner-viewport {
            flex: 1; width: 100%; max-width: 800px; margin: 0 auto;
            position: relative; z-index: 10; display: flex; flex-direction: column;
            overflow: hidden; padding: 20px;
        }

        .question-card {
            background: linear-gradient(145deg, rgba(11, 14, 20, 0.9) 0%, rgba(5, 7, 10, 0.95) 100%);
            border: 1px solid var(--metal-border); border-radius: 15px;
            padding: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 20px rgba(0, 240, 255, 0.02);
            display: flex; flex-direction: column; flex: 1;
            position: absolute; top: 20px; left: 20px; right: 20px; bottom: 20px;
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.5s ease;
            opacity: 0; transform: translateX(50px); pointer-events: none;
        }
        .question-card.active { opacity: 1; transform: translateX(0); pointer-events: auto; }
        .question-card.prev { opacity: 0; transform: translateX(-50px); pointer-events: none; }

        /* Блок Инфо (Иконка + Название Блока) */
        .block-header {
            display: flex; align-items: center; gap: 15px; margin-bottom: 25px;
            padding-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .block-icon { width: 40px; height: 40px; filter: drop-shadow(0 0 8px var(--cyan-glow)); }
        .block-name { font-family: 'Rajdhani', sans-serif; color: var(--text-muted); font-size: 1rem; text-transform: uppercase; letter-spacing: 2px; font-weight: 600;}

        /* Текст Вопроса */
        .q-title {
            font-size: 1.3rem; line-height: 1.5; font-weight: 500; color: #fff;
            margin-bottom: 30px; text-shadow: 0 2px 5px rgba(0,0,0,0.8);
        }

        /* Варианты ответов */
        .options-list { display: flex; flex-direction: column; gap: 12px; overflow-y: auto; flex: 1; padding-right: 5px;}
        .options-list::-webkit-scrollbar { width: 4px; }
        .options-list::-webkit-scrollbar-thumb { background: var(--metal-border); border-radius: 2px; }

        .option-lbl {
            display: flex; align-items: flex-start; gap: 15px;
            background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05);
            padding: 18px 20px; border-radius: 12px; cursor: pointer; transition: 0.3s;
            position: relative; overflow: hidden;
        }
        .option-lbl::before {
            content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 100%;
            background: var(--cyan-core); opacity: 0; transition: 0.3s;
        }
        .option-lbl:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.1); transform: translateX(5px);}
        
        .option-radio { display: none; }
        
        .radio-box {
            width: 22px; height: 22px; border: 2px solid var(--text-muted); border-radius: 50%;
            display: flex; justify-content: center; align-items: center; flex-shrink: 0;
            transition: 0.3s; margin-top: 2px;
        }
        .radio-box::after {
            content: ''; width: 10px; height: 10px; background: var(--cyan-core); border-radius: 50%;
            opacity: 0; transform: scale(0); transition: 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 0 10px var(--cyan-core);
        }

        .option-text { font-size: 1rem; color: #b0c0d0; line-height: 1.4; transition: 0.3s; }

        /* Активное состояние ответа */
        .option-radio:checked + .radio-box { border-color: var(--cyan-core); box-shadow: 0 0 10px var(--cyan-dim); }
        .option-radio:checked + .radio-box::after { opacity: 1; transform: scale(1); }
        .option-radio:checked ~ .option-text { color: #fff; font-weight: 500; }
        .option-lbl.selected { background: rgba(0, 240, 255, 0.05); border-color: rgba(0, 240, 255, 0.3); }
        .option-lbl.selected::before { opacity: 1; }

        /* Поле "Свой вариант" и Ввод возраста */
        .custom-input-wrapper {
            margin-top: 10px; display: none; opacity: 0; transition: opacity 0.3s;
        }
        .custom-input-wrapper.visible { display: block; opacity: 1; }
        
        .cyber-input {
            width: 100%; background: rgba(0,0,0,0.5); border: 1px solid var(--metal-border);
            border-bottom: 2px solid var(--cyan-core); color: var(--cyan-core);
            padding: 15px 20px; font-family: 'Share Tech Mono', monospace; font-size: 1.1rem;
            border-radius: 8px 8px 0 0; outline: none; transition: 0.3s;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }
        .cyber-input:focus { background: rgba(0, 240, 255, 0.02); box-shadow: inset 0 0 15px rgba(0, 240, 255, 0.1); }
        .cyber-input::placeholder { color: rgba(0, 240, 255, 0.3); }

        /* Поле ввода для Возраста (Вопрос 0) */
        .age-input {
            font-size: 2rem; text-align: center; border-bottom: 3px solid var(--cyan-core);
            padding: 20px; letter-spacing: 2px;
        }

        /* === НАВИГАЦИЯ НИЗ === */
        .nav-footer {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 20px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.05);
        }

        .btn {
            background: transparent; border: 1px solid var(--metal-border); color: var(--text-muted);
            padding: 12px 25px; border-radius: 30px; font-family: 'Rajdhani', sans-serif;
            font-size: 1rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
            cursor: pointer; transition: 0.3s; outline: none;
        }
        .btn:hover:not(:disabled) { border-color: #fff; color: #fff; }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }

        .btn-next {
            background: rgba(0, 240, 255, 0.05); border-color: var(--cyan-core); color: var(--cyan-core);
            box-shadow: 0 0 15px var(--cyan-dim);
        }
        .btn-next:hover:not(:disabled) {
            background: rgba(0, 240, 255, 0.15); box-shadow: 0 0 25px var(--cyan-glow); color: #fff;
        }

        /* Финальная кнопка */
        .btn-finish {
            background: linear-gradient(135deg, var(--cyan-core) 0%, #0088ff 100%);
            color: #000; border: none; box-shadow: 0 0 20px var(--cyan-glow);
        }
        .btn-finish:hover:not(:disabled) {
            filter: brightness(1.2); box-shadow: 0 0 30px var(--cyan-core); color: #000;
        }

        /* Экран загрузки результатов */
        #processing-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(5, 7, 10, 0.95); z-index: 999999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.5s ease; backdrop-filter: blur(10px);
        }
        #processing-overlay.active { opacity: 1; pointer-events: auto; }
        
        .core-spinner {
            width: 100px; height: 100px; border-radius: 50%;
            border: 3px solid transparent; border-top-color: var(--cyan-core);
            border-bottom-color: var(--cyan-core);
            animation: spin 1.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
            margin-bottom: 30px; box-shadow: 0 0 30px var(--cyan-dim);
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .process-text {
            color: var(--cyan-core); font-family: 'Share Tech Mono', monospace;
            font-size: 1.2rem; text-shadow: 0 0 10px var(--cyan-glow);
        }

        /* === АДАПТИВ === */
        @media (max-width: 600px) {
            .hud-container { padding: 15px 15px 0; }
            .hud-title { font-size: 1rem; letter-spacing: 2px; }
            .hud-percent { font-size: 1.2rem; }
            .scanner-viewport { padding: 15px; }
            .question-card { padding: 20px; top: 15px; left: 15px; right: 15px; bottom: 15px; }
            .q-title { font-size: 1.15rem; margin-bottom: 20px; }
            .option-lbl { padding: 15px; gap: 10px; }
            .option-text { font-size: 0.9rem; }
            .btn { padding: 12px 20px; font-size: 0.9rem; }
            .block-icon { width: 30px; height: 30px; }
            .age-input { font-size: 1.5rem; padding: 15px;}
        }
    </style>
</head>
<body>

    <div id="security-overlay">
        <div class="security-text">ИДЕНТИФИКАЦИЯ...</div>
    </div>

    <div class="cyber-grid"></div>
    <div class="glow-orb"></div>

    <div class="hud-container">
        <div class="hud-top">
            <div class="hud-title">СИНХРОНИЗАЦИЯ</div>
            <div class="hud-percent" id="hud-percent">0%</div>
        </div>
        <div class="hud-track">
            <div class="hud-fill" id="hud-fill"></div>
        </div>
    </div>

    <div class="scanner-viewport" id="viewport">
        <!-- Карточки генерируются скриптом -->
    </div>

    <div id="processing-overlay">
        <div class="core-spinner"></div>
        <div class="process-text" id="process-log">КОМПИЛЯЦИЯ ДАННЫХ...</div>
    </div>

    <!-- Аудио эффекты -->

    <audio id="sound-success" src="https://actions.google.com/sounds/v1/science_fiction/telemetry_fast.ogg" preload="auto"></audio>

        const uiSuccess = document.getElementById('sound-success');
        uiTick.volume = 0.2; uiSuccess.volume = 0.3;

        function playTick() { uiTick.currentTime = 0; uiTick.play().catch(()=>{}); }

        // === БАЗА ВОПРОСОВ (36 ШАГОВ: 1 ВВОДНЫЙ + 35 ОСНОВНЫХ) ===
        // Сохраняем АБСОЛЮТНО ВСЕ ТЕКСТЫ без единого сокращения.

                    '[Д] Нахожусь на стыке: наука — это просто язык, на котором с нами говорит Вселенная.',
                    '[Е] Свой вариант...'
                ]
            },
            {
                id: 'q33', block: 'БЛОК 5: ЦЕЛИ И ПРАКТИКА', icon: 'https://res.cloudinary.com/dmirmbjtj/image/upload/v1778112833/9_1_wcnpr3.webp', type: 'radio',
                title: '33. Сколько времени каждый день ты реально готов тратить на практики?',
                options: [
                    '[А] 3–5 минут максимум. Мне нужен быстрый инструмент, а не долгая медитация.',

                    '[Е] Свой вариант...'
                ]
            },
            {
                id: 'q34', block: 'БЛОК 5: ЦЕЛИ И ПРАКТИКА', icon: 'https://res.cloudinary.com/dmirmbjtj/image/upload/v1778112833/9_1_wcnpr3.webp', type: 'radio',
                title: '34. Чего ты больше всего боишься, начиная работу со своей психикой и подсознанием?',
                options: [
                    '[А] Встретиться с тяжелыми эмоциями и потерять контроль над тревогой.',
                    '[Б] Понять, что я живу не своей жизнью, и придется всё менять.',
                    '[В] Навредить себе на физическом уровне (страх задохнуться, умереть во время задержек).',
                    '[Г] Что это очередная игрушка, которая не сработает, и я брошу на полпути.',
                    '[Д] У меня нет страха. Я готов ко всему, что найду внутри.',
                    '[Е] Свой вариант...'
                ]
            },
            {
                id: 'q35', block: 'БЛОК 5: ЦЕЛИ И ПРАКТИКА', icon: 'https://res.cloudinary.com/dmirmbjtj/image/upload/v1778112833/9_1_wcnpr3.webp', type: 'radio',
                title: '35. По какому главному изменению ты поймешь, что приложение реально сработало через месяц?',
                options: [
                    '[А] Я перестану срываться на близких и буду спать как камень.',
                    '[Б] Я пробью финансовый или карьерный потолок за счет сильного фокуса.',
                    '[В] Уйдут хронические боли, шея и спина перестанут быть "деревянными".',
                    '[Г] Я начну чувствовать радость от простых вещей, слезу с дофаминовой иглы.',
                    '[Д] Я обрету полный контроль над пульсом, гормонами и мыслями.',
                    '[Е] Свой вариант...'
                ]
            }
        ];

        // === ДВИЖОК АНКЕТЫ ===
        let currentStep = 0;
        const totalSteps = qData.length;
        const answers = {}; 

        const viewport = document.getElementById('viewport');
        const hudPercent = document.getElementById('hud-percent');
        const hudFill = document.getElementById('hud-fill');

        function updateProgress() {
            const pct = Math.round((currentStep / totalSteps) * 100);
            
            // Эффект скремблинга цифр
            let scramble = 0;
            const scrambleInterval = setInterval(() => {
                hudPercent.innerText = Math.floor(Math.random() * 100) + '%';
                scramble++;
                if(scramble > 5) {
                    clearInterval(scrambleInterval);
                    hudPercent.innerText = pct + '%';
                }
            }, 30);

            hudFill.style.width = pct + '%';
        }

        function createCard(data, index) {
            const card = document.createElement('div');
            card.className = `question-card ${index === 0 ? 'active' : ''}`;
            card.id = `card-${index}`;

            let html = `
                <div class="block-header">
                    <img src="${data.icon}" class="block-icon" alt="icon">
                    <span class="block-name">${data.block}</span>
                </div>
                <div class="q-title">${data.title}</div>
            `;

            if (data.type === 'input') {
                html += `
                    <input type="text" class="cyber-input age-input" id="input-${index}" placeholder="${data.placeholder}" autocomplete="off">
                `;
            } else {
                html += `<div class="options-list">`;
                data.options.forEach((opt, optIndex) => {
                    const isCustom = opt.includes('[Е]');
                    html += `
                        <label class="option-lbl" onclick="selectOption(${index}, this, ${isCustom})">
                            <input type="radio" name="q${index}" value="${opt}" class="option-radio">
                            <div class="radio-box"></div>
                            <div class="option-text">${opt}</div>
                        </label>
                    `;
                });
                html += `</div>
                <div class="custom-input-wrapper" id="custom-wrap-${index}">
                    <input type="text" class="cyber-input" id="custom-input-${index}" placeholder="Опиши свой вариант кратко..." autocomplete="off">
                </div>`;
            }

            const btnText = index === totalSteps - 1 ? 'ИНИЦИИРОВАТЬ АНАЛИЗ' : 'ДАЛЕЕ';
            const btnClass = index === totalSteps - 1 ? 'btn btn-next btn-finish' : 'btn btn-next';

            html += `
                <div class="nav-footer">
                    <button class="btn" onclick="prevStep()" ${index === 0 ? 'disabled' : ''}>НАЗАД</button>
                    <button class="${btnClass}" id="next-btn-${index}" onclick="nextStep()" disabled>${btnText}</button>
                </div>
            `;

            card.innerHTML = html;
            return card;
        }

        function renderAll() {
            qData.forEach((q, i) => {
                viewport.appendChild(createCard(q, i));
                
                // Слушатель для текстовых инпутов, чтобы включать кнопку ДАЛЕЕ
                if(q.type === 'input') {
                    const inp = document.getElementById(`input-${i}`);
                    inp.addEventListener('input', () => {
                        const btn = document.getElementById(`next-btn-${i}`);
                        btn.disabled = inp.value.trim().length < 2;
                    });
                }
            });
        }

        window.selectOption = function(qIndex, labelEl, isCustom) {
            playTick();
            
            // Сбрасываем выделение
            const allLabels = labelEl.parentElement.querySelectorAll('.option-lbl');
            allLabels.forEach(lbl => lbl.classList.remove('selected'));
            
            // Выделяем текущий
            labelEl.classList.add('selected');

            // Показываем/скрываем инпут для своего варианта
            const customWrap = document.getElementById(`custom-wrap-${qIndex}`);
            const nextBtn = document.getElementById(`next-btn-${qIndex}`);

            if (isCustom) {
                customWrap.classList.add('visible');
                const customInp = document.getElementById(`custom-input-${qIndex}`);
                nextBtn.disabled = customInp.value.trim().length < 2;
                
                customInp.oninput = () => { nextBtn.disabled = customInp.value.trim().length < 2; };
                customInp.focus();
            } else {
                customWrap.classList.remove('visible');
                nextBtn.disabled = false;
            }
        };

        window.prevStep = function() {
            if (currentStep > 0) {
                playTick();
                const currentCard = document.getElementById(`card-${currentStep}`);
                currentCard.classList.remove('active');
                currentCard.style.transform = 'translateX(50px)';
                currentCard.style.opacity = '0';
                
                currentStep--;
                
                const prevCard = document.getElementById(`card-${currentStep}`);
                prevCard.classList.add('active');
                prevCard.classList.remove('prev');
                prevCard.style.transform = 'translateX(0)';
                prevCard.style.opacity = '1';
                
                updateProgress();
            }
        };

        window.nextStep = function() {
            // Сохраняем ответ
            const q = qData[currentStep];
            if (q.type === 'input') {
                answers[q.id] = document.getElementById(`input-${currentStep}`).value.trim();
            } else {
                const selectedInput = document.querySelector(`input[name="q${currentStep}"]:checked`);
                if(selectedInput.value.includes('[Е]')) {
                    answers[q.id] = "CUSTOM: " + document.getElementById(`custom-input-${currentStep}`).value.trim();
                } else {
                    answers[q.id] = selectedInput.value;
                }
            }

            if (currentStep < totalSteps - 1) {
                playTick();
                const currentCard = document.getElementById(`card-${currentStep}`);
                currentCard.classList.remove('active');
                currentCard.classList.add('prev');
                currentCard.style.transform = 'translateX(-50px)';
                currentCard.style.opacity = '0';
                
                currentStep++;
                
                const nextCard = document.getElementById(`card-${currentStep}`);
                nextCard.classList.add('active');
                nextCard.style.transform = 'translateX(0)';
                nextCard.style.opacity = '1';
                
                updateProgress();
            } else {
                // ФИНАЛ: Запуск сохранения в базу
                initiateAnalysis();
            }
        };

        // Запуск
        renderAll();
        updateProgress();

    </script>

    <!-- === СКРИПТ БЕЗОПАСНОСТИ И СОХРАНЕНИЯ В БАЗУ === -->
    <script type="module">
        import { auth, onAuthStateChanged, db, doc, getDoc, setDoc } from './firebase-config.js';

        const securityOverlay = document.getElementById('security-overlay');
        let currentUser = null;

        // 1. Блокируем доступ левым юзерам
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.replace("https://fatumalogy-ctrl.github.io/Fatum/index.html");
                return;
            }

            currentUser = user;

            try {
                // Проверяем, есть ли оплата Эфира (чтобы чужие не лезли в анкету)
                const productDocRef = doc(db, "users", user.uid, "products", "aether");
                const productDocSnap = await getDoc(productDocRef);

                if (productDocSnap.exists() && productDocSnap.data().hasAccess === true) {
                    securityOverlay.style.opacity = '0';
                    setTimeout(() => securityOverlay.style.display = 'none', 500);
                } else {
                    window.location.replace("https://fatumalogy-ctrl.github.io/Fatum/aetherdoor.html"); 
                }
            } catch (error) {
                window.location.replace("https://fatumalogy-ctrl.github.io/Fatum/index.html");
            }
        });

        // 2. Функция сохранения (вызывается на последнем шаге)
        window.initiateAnalysis = async function() {
            if (!currentUser) return;
            
            uiSuccess.currentTime = 0; uiSuccess.play().catch(()=>{});

            // Показываем экран загрузки
            const procOverlay = document.getElementById('processing-overlay');
            const procText = document.getElementById('process-log');
            procOverlay.classList.add('active');

            // Анимация текста
            const logs = [
                "СТРУКТУРИРОВАНИЕ ДАННЫХ...",
                "ВЫГРУЗКА В НЕЙРОМАТРИЦУ...",
                "ЗАПИСЬ В БАЗУ ДАННЫХ...",
                "ИНТЕГРАЦИЯ УСПЕШНА."
            ];
            
            let logIdx = 0;
            const logInterval = setInterval(() => {
                logIdx++;
                if(logIdx < logs.length) procText.innerText = logs[logIdx];
            }, 800);

            try {
                // Сохраняем ответы по ПРАВИЛЬНОМУ пути: users/{uid}/aether_data/anketa
                const anketaRef = doc(db, "users", currentUser.uid, "aether_data", "anketa");
                
                // Добавляем timestamp
                answers.submittedAt = new Date().toISOString();

                await setDoc(anketaRef, answers);

                // После успешного сохранения перекидываем обратно в Терминал
                setTimeout(() => {
                    clearInterval(logInterval);
                    window.location.replace("https://fatumalogy-ctrl.github.io/Fatum/terminal.html");
                }, 3500);

            } catch (error) {
                console.error("Ошибка записи:", error);
                procText.innerText = "ОШИБКА СИНХРОНИЗАЦИИ. ПОВТОРИТЕ.";
                procText.style.color = "var(--alert)";
                setTimeout(() => {
                    procOverlay.classList.remove('active');
                }, 3000);
            }
        };
    </script>
